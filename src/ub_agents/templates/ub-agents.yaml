# Project-owned starter. Customize models, checks, instructions, and merge authority.
repository: your-org/your-project
shared-instructions: .agents/ub_agents.md
queue:
  milestones: ignore
  dependencies: wait

# Reinstall control-checkout dependencies after watched files change on refresh.
# Upgrade every launcher before enabling this setting.
# checkout-setup:
#   command: [mise, run, install]
#   when-changed: [pnpm-lock.yaml, mise.toml]
#   timeout-seconds: 600

# Default arguments for each CLI; add the other CLI's entry for mixed runtimes.
# Grants full access without the Codex sandbox: https://github.com/uberblick-ai/ub-agents/blob/main/docs/configuration.md#runtime-permissions
# runtime-args:
#   codex: [--sandbox, danger-full-access]
# An agent's runtime-args list or mapping replaces these defaults entirely.
# Omit the agent key to inherit; an empty list or mapping disables the defaults.

# Customize these outcomes and rules with the project's owners.
agents:
  issue-preparer:
    runtime: "codex:gpt-6.1-sol:high"
    kind: issue
    trigger: needs-preparation
    outcomes:
      prepared: {add: [ready]}
      needs-human: {add: [needs-human]}
    instructions: .agents/issue-preparer.md
    worktree: true
    agent-timeout-minutes: 60

  implementer:
    runtime: "codex:gpt-6.1-sol:high"
    trigger: [ready, needs-changes]
    outcomes:
      handed-off: {add: [needs-review]}
    instructions: .agents/implementer.md
    worktree: true
    agent-timeout-minutes: 180

  reviewer:
    runtime: "codex:gpt-6.1-sol:high"
    kind: pr
    trigger: needs-review
    outcomes:
      approved: {add: [ready-to-merge]}
      changes-requested: {add: [needs-changes]}
    instructions: .agents/reviewer.md
    worktree: true
    agent-timeout-minutes: 180
    # For independent cross-provider review, configure an eligible alternative:
    # runtime: "claude:claude-opus-5-5:high"
    # different-runtime-from: implementer
    # Native GitHub approval requires an identity other than the PR author.

  integrator:
    runtime: "codex:gpt-6.1-sol:high"
    kind: pr
    trigger: ready-to-merge
    outcomes:
      merged: {}
      maintainer-merge: {add: [needs-human]}
      changes-requested: {add: [needs-changes]}
    instructions: .agents/integrator.md
    worktree: true
    agent-timeout-minutes: 180

limits:
  agent-timeout-minutes: 180
  max-attempts: 5
  retry-backoff-seconds: 60
  max-backoff-seconds: 3600

poll-seconds: 30
stop-labels: [needs-human]
