<!doctype html>
<!--
  The ub-agents monitor: what needs a person, what runs now and what ended in
  the last 24 hours, on every machine that runs a launcher for the repository.
  `ub-agents monitor` serves it on 127.0.0.1 and computes /snapshot.json with
  the launcher's own record rules; this page only draws it and notifies.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ub-agents</title>
    <style>
      /* The terminal palette (VIEW_THEME in view/theme.py). */
      :root {
        color-scheme: dark;
        --background: #0d1016;
        --panel: #161a22;
        --foreground: #d4d9e1;
        --muted: #6b7484;
        --border: #2a303b;
        --selection: #1b2030;
        --running: #6cb6ff;
        --accent: #b79cff;
        --success: #7ee2a0;
        --attention: #ff8b7f;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --background: #f7f8fa;
          --panel: #ffffff;
          --foreground: #1d232c;
          --muted: #687284;
          --border: #d5dae2;
          --selection: #eceff5;
          --running: #1f6fd1;
          --accent: #7a55d6;
          --success: #18804a;
          --attention: #c8382c;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      a, button { color: inherit; font: inherit; }
      main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 72px; }
      .muted { color: var(--muted); }
      .running { color: var(--running); }
      .success { color: var(--success); }
      .attention { color: var(--attention); }
      /* A panel's title sits in its top border, as in the terminal view. */
      .panel {
        position: relative;
        margin-top: 26px;
        padding: 18px 16px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .panel > h2 {
        position: absolute;
        top: -0.8em;
        left: 12px;
        margin: 0;
        padding: 0 6px;
        background: var(--background);
        font-size: 13px;
        font-weight: 500;
      }
      .panel.attention-panel { border-color: var(--attention); }
      .panel.running-panel { border-color: var(--running); }
      .row {
        display: grid;
        grid-template-columns: 2ch minmax(0, 1fr) 16ch 22ch 12ch;
        gap: 2px 14px;
        padding: 7px 8px;
        margin: 0 -8px;
      }
      .row + .row, details + details { border-top: 1px solid var(--border); }
      .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .right { text-align: right; }
      .sub, .block { grid-column: 2 / -1; color: var(--muted); }
      .block { white-space: normal; max-width: 110ch; }
      .needs .row { grid-template-columns: 2ch minmax(0, 1fr) auto; }
      ul.block { margin: 6px 0 0; padding: 0; list-style: none; color: var(--foreground); }
      ul.block li::before { content: "→ "; color: var(--attention); }
      ol.block { margin: 2px 0 0; padding-left: 3ch; color: var(--foreground); }
      .item a { text-decoration: none; }
      .item a:hover { text-decoration: underline; }
      .ref { margin-right: 8px; font-weight: 600; }
      .discuss {
        margin-right: 12px;
        padding: 1px 8px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--accent);
        text-decoration: none;
      }
      details > summary { list-style: none; cursor: pointer; }
      details > summary::-webkit-details-marker { display: none; }
      details[open] > summary, details > summary:hover { background: var(--selection); }
      .detail { padding: 6px 8px 12px calc(2ch + 22px); margin: 0 -8px; background: var(--selection); }
      .detail p { margin: 0 0 8px; white-space: pre-wrap; max-width: 110ch; }
      .banner { margin-top: 14px; padding: 8px 12px; border: 1px solid var(--attention); color: var(--attention); }
      .hint { color: var(--accent); margin: 8px 0 0; }
      .status {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 24px;
        border-top: 1px solid var(--border);
        background: var(--background);
        white-space: nowrap;
      }
      /* The terminal view's spinner (view/spinner.py), shown while GitHub is read. */
      .spinner { display: inline-block; width: 2ch; color: var(--running); }
      .spinner[hidden] { display: none; }
      /* The GitHub REST budget left this hour, coral when it runs low. */
      .budget { display: inline-flex; align-items: center; gap: 6px; }
      .bar { display: inline-block; width: 8ch; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--success); }
      .bar.low > span { background: var(--attention); }
      .link { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
      .picker { position: fixed; right: 24px; bottom: 44px; background: var(--panel); }
      .picker > h2 { background: var(--panel); }
      .picker label { display: flex; gap: 8px; padding: 2px 0; cursor: pointer; }
      @media (max-width: 860px) {
        .row { grid-template-columns: 2ch minmax(0, 1fr) auto; }
        .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>ub-agents</strong> <span class="muted" id="repository"></span>
      <p class="hint" id="notify-hint" hidden></p>
      <div id="app" class="muted"><span class="spinner">⠋</span>Reading coordination records…</div>
    </main>
    <div class="status" role="status">
      <span><span class="spinner" id="poll-spinner" hidden>⠋</span><span id="freshness"></span></span>
      <span id="keys"></span>
    </div>
    <section class="panel picker" id="picker" hidden></section>
    <script>
      "use strict";
      const POLL_SECONDS = 30;
      const NOTIFY_KEY = "ub-agents-monitor.notify";
      const EVENTS_KEY = "ub-agents-monitor.notify-events";
      // A stop label or a blocked report stays on screen until it's dismissed.
      const EVENTS = [
        { id: "label", urgent: true },
        { id: "blocked", text: "a run reports blocked", urgent: true },
        { id: "started", text: "a run starts" },
        { id: "ended", text: "a run ends" },
        { id: "expired", text: "a run expires without a result" },
      ];
      // More ordinary notifications than this in one poll arrive as one summary.
      const NOTIFY_SINGLY = 3;
      const TEST_HINT_MS = 20_000;
      const SPINNER = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

      const state = { data: null, error: null, loading: false, lastPoll: 0, seen: null, open: new Set(), choosing: false, testSentAt: 0 };
      const time = (stamp) => new Date(stamp).getTime();

      /* ── Drawing ── Text from GitHub is only ever set as text, never parsed as markup. */
      const el = (tag, props = {}, ...children) => {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value === true ? "" : value);
        }
        node.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
        return node;
      };
      const link = (href, text) => el("a", { href, target: "_blank", rel: "noreferrer" }, text);
      const duration = (ms) => {
        const s = Math.max(0, Math.floor(ms / 1000));
        if (s < 60) return `${s}s`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m`;
        const h = Math.floor(m / 60);
        return h < 48 ? (m % 60 ? `${h}h ${m % 60}m` : `${h}h`) : `${Math.floor(h / 24)}d`;
      };
      const FORMATS = { ago: (ms) => `${duration(ms)} ago`, for: duration };
      // Times the per-second tick rewrites in place, so open rows and focus survive.
      const clock = (stamp, format) => el("span", { "data-since": stamp, "data-format": format }, FORMATS[format](Date.now() - time(stamp)));
      const machine = (host) => host || "unknown machine";
      const ref = (item) => `${item.kind === "pr" ? "PR " : ""}#${item.number}`;
      const itemLink = (item) => el("div", { class: "cell item" }, link(item.url, [el("span", { class: "ref" }, ref(item)), item.title || ""]));
      const panel = (title, count, classes, children) =>
        el("section", { class: `panel ${classes}` }, el("h2", {}, title, el("span", { class: "muted" }, ` · ${count}`)), children);

      // Opens a Claude Code session in the Claude app, in this checkout, with the
      // prompt filled in: the app asks to confirm the folder, and the viewer sends it.
      const discussUrl = (number) => {
        const params = new URLSearchParams({ q: `help me unblock #${number} using the ub-agents-unblock skill` });
        if (state.data?.folder) params.set("folder", state.data.folder);
        return `claude://code/new?${params.toString().replace(/\+/g, "%20")}`;
      };

      const needsPanel = (entries, stopLabels) =>
        panel("Needs human", entries.length, entries.length ? "needs attention-panel" : "needs",
          entries.length
            ? entries.map(({ item, labels, ask, notice }) =>
                el("div", { class: "row" },
                  el("span", { class: "attention" }, "!"),
                  itemLink(item),
                  el("span", { class: "attention" }, labels.join(", ")),
                  el("div", { class: "sub" }, ask ? [`${ask.agent}${ask.outcome ? ` · ${ask.outcome}` : ""} · `, clock(ask.created, "ago")] : "No outcome on record: read the item."),
                  ask?.actions.length ? el("ul", { class: "block" }, ask.actions.map((a) => el("li", {}, a)))
                    : ask?.summary ? el("div", { class: "block" }, ask.summary) : null,
                  ask?.options.length ? [el("div", { class: "block" }, "Options, recommended first:"), el("ol", { class: "block" }, ask.options.map((o) => el("li", {}, o)))] : null,
                  el("div", { class: "block" },
                    el("a", { class: "discuss", href: discussUrl(item.number), title: "Opens a Claude Code session in this checkout with the unblock prompt filled in" }, "discuss with Claude"),
                    notice ? [link(notice, "action needed"), " · "] : null,
                    ask ? link(ask.url, "outcome record") : link(item.url, "open the item"))))
            : el("div", { class: "muted" }, el("span", { class: "success" }, "✓ "), `Nothing waits for a person · stop labels: ${stopLabels.join(", ")}`));

      const runRow = (run, glyph, tone, last) =>
        el("div", { class: "row" },
          el("span", { class: tone }, glyph),
          itemLink(run.item),
          el("div", { class: "cell wide" }, run.agent),
          el("div", { class: "cell wide" }, machine(run.host)),
          last,
          el("div", { class: "sub" }, `attempt ${run.attempt} · ${run.runtime} · by ${run.actor}`));

      const runningPanel = (runs) =>
        panel("Running", runs.length, runs.length ? "running-panel" : "",
          runs.length
            ? runs.map((run) => runRow(run, SPINNER[frame], "spinner", el("div", { class: "cell right running", title: run.renewed ? `renewed ${new Date(run.renewed).toLocaleTimeString()}` : null },
                run.state === "claiming" ? "claiming" : clock(run.started, "for"))))
            : el("div", { class: "muted" }, "Idle · nothing running on any machine"));

      const expiredPanel = (runs) =>
        runs.length
          ? panel("Expired without a result", runs.length, "attention-panel", [
              el("div", { class: "muted" }, "Their launcher stopped renewing them. The next launcher that picks the item up recovers it."),
              runs.map((run) => runRow(run, "×", "attention", el("div", { class: "cell right muted" }, clock(run.expires, "ago")))),
            ])
          : null;

      const recentPanel = (runs) => {
        const cost = runs.reduce((sum, run) => sum + (run.cost ?? 0), 0);
        const tone = (run) => ({ success: "success", blocked: "attention", retry: "attention" })[run.status] ?? "muted";
        const usage = (run) => [run.tokens == null ? "" : `${Math.round(run.tokens / 1000)}k tokens`, run.cost == null ? "" : `$${run.cost.toFixed(2)}`].filter(Boolean).join(" · ");
        return panel("Recent activity", `${runs.length} runs · $${cost.toFixed(2)} · last 24 h`, "",
          runs.length
            ? runs.map((run) =>
                el("details", { open: state.open.has(run.id), ontoggle: (e) => (e.target.open ? state.open.add(run.id) : state.open.delete(run.id)) },
                  el("summary", { class: "row" },
                    el("span", { class: tone(run) }, { success: "✓", blocked: "⏸", retry: "×" }[run.status] ?? "·"),
                    itemLink(run.item),
                    el("div", { class: `cell wide ${tone(run)}` }, run.result),
                    el("div", { class: "cell wide" }, `${machine(run.host)} · ${duration(time(run.ended) - time(run.started))}`),
                    el("div", { class: "cell right muted" }, clock(run.ended, "ago")),
                    el("div", { class: "sub cell" }, `${run.agent} · ${run.summary || "no summary"}`)),
                  el("div", { class: "detail" },
                    run.summary ? el("p", {}, run.summary) : null,
                    el("div", { class: "muted" }, `${run.agent} · ${machine(run.host)} · attempt ${run.attempt} · ${run.runtime} · by ${run.actor}`, usage(run) ? ` · ${usage(run)}` : "", " · ", link(run.url, "coordination record")))))
            : el("div", { class: "muted" }, "No runs ended in the last 24 hours."));
      };

      const render = () => {
        const app = document.getElementById("app");
        const { data } = state;
        if (!data) {
          app.replaceChildren(...(state.error ? [el("div", { class: "banner" }, `Couldn't read GitHub: ${state.error}`)] : [el("span", { class: "spinner" }, SPINNER[0]), "Reading coordination records…"]));
          return tick();
        }
        app.className = "";
        document.getElementById("repository").textContent = `· ${data.repository}`;
        document.title = data.needs_human.length ? `(${data.needs_human.length}) needs human · ub-agents`
          : data.running.length ? `${data.running.length} running · ub-agents` : "ub-agents";
        app.replaceChildren(
          state.error ? el("div", { class: "banner" }, `Couldn't refresh: ${state.error}. Showing the last result.`) : "",
          ...data.notices.map((notice) => el("div", { class: "banner" }, notice)),
          needsPanel(data.needs_human, data.stop_labels),
          runningPanel(data.running),
          expiredPanel(data.expired) ?? "",
          recentPanel(data.recent));
        renderPicker();
        tick();
      };

      /* ── Notifications ── */
      const stored = (key, fallback) => {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
      };
      const store = (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* kept for this tab */ }
      };
      const chosen = () => stored(EVENTS_KEY, ["label"]).filter((id) => EVENTS.some((e) => e.id === id));
      const eventText = (event) => event.text ?? `an item gets the ${(state.data?.stop_labels ?? ["needs-human"]).join(" or ")} label`;
      const permission = () => ("Notification" in window ? Notification.permission : "denied");
      const notifyOn = () => stored(NOTIFY_KEY, false) && permission() === "granted";

      // What a poll found that could notify, by event. The first poll sets the
      // baseline: nothing notifies on load.
      const keysOf = (data) => ({
        label: new Set(data.needs_human.filter((e) => e.labelled).map((e) => e.item.number)),
        blocked: new Set(data.needs_human.filter((e) => !e.labelled).map((e) => `${e.item.number}:${e.ask?.url}`)),
        started: new Set(data.running.map((r) => r.id)),
        ended: new Set(data.recent.map((r) => r.id)),
        expired: new Set(data.expired.map((r) => r.id)),
      });
      const changesOf = (data) => {
        const keys = keysOf(data);
        const before = state.seen;
        state.seen = keys;
        if (!before) return [];
        const fresh = (event, key) => !before[event].has(key);
        const change = (event, item, title, body) => ({ event, item, title: `${title} · ${ref(item)} ${item.title}`, body });
        const ask = (entry) => entry.ask?.actions[0] || entry.ask?.summary || "The loop stopped on it until a person answers.";
        return [
          ...data.needs_human.filter((e) => e.labelled && fresh("label", e.item.number)).map((e) => change("label", e.item, e.labels.join(", "), ask(e))),
          ...data.needs_human.filter((e) => !e.labelled && fresh("blocked", `${e.item.number}:${e.ask?.url}`)).map((e) => change("blocked", e.item, "blocked", ask(e))),
          ...data.expired.filter((r) => fresh("expired", r.id)).map((r) => change("expired", r.item, "expired", `${r.agent} on ${machine(r.host)} stopped renewing its run.`)),
          ...data.recent.filter((r) => fresh("ended", r.id)).map((r) => change("ended", r.item, r.result, [r.agent, r.summary].filter(Boolean).join(" · "))),
          ...data.running.filter((r) => fresh("started", r.id)).map((r) => change("started", r.item, "started", `${r.agent} on ${machine(r.host)}`)),
        ];
      };

      // A tag of its own for every notification: a reused tag replaces the
      // earlier one without showing the new one.
      let serial = 0;
      const show = ({ title, body, url, urgent }) => {
        const notification = new Notification(title, { body, tag: `ub-agents:${Date.now()}:${serial++}`, requireInteraction: Boolean(urgent) });
        notification.onclick = () => {
          window.focus();
          if (url) window.open(url, "_blank", "noreferrer");
          notification.close();
        };
      };
      const notify = (changes) => {
        if (!notifyOn()) return;
        const wanted = changes.filter((c) => chosen().includes(c.event)).map((c) => ({ ...c, url: c.item.url, urgent: EVENTS.find((e) => e.id === c.event).urgent }));
        // One notification per item and poll, its most urgent change winning.
        const byItem = new Map();
        for (const change of wanted) if (!byItem.has(change.url) || (change.urgent && !byItem.get(change.url).urgent)) byItem.set(change.url, change);
        const urgent = [...byItem.values()].filter((c) => c.urgent);
        const ordinary = [...byItem.values()].filter((c) => !c.urgent);
        urgent.forEach(show);
        if (ordinary.length <= NOTIFY_SINGLY) ordinary.forEach(show);
        else show({ title: `${ordinary.length} changes · ub-agents`, body: ordinary.map((c) => c.title).join("\n") });
      };

      // The browser accepts a notification even when the system won't show it,
      // so switching them on sends a test and says where to look.
      const sendTest = () => {
        const what = EVENTS.filter((e) => chosen().includes(e.id)).map(eventText).join(", or when ");
        show({ title: "ub-agents monitor", body: `Notifications are on. You'll get one when ${what || "nothing: choose what to be notified about"}.` });
        state.testSentAt = Date.now();
      };
      const notifyHint = () => {
        if (Date.now() - state.testSentAt >= TEST_HINT_MS) return null;
        return /Mac/.test(navigator.userAgent)
          ? "Sent a test notification. Nothing showed up? Open System Settings › Notifications, find this browser and turn on Allow notifications; also check that Focus is off."
          : "Sent a test notification. Nothing showed up? Check the system's notification settings for this browser.";
      };

      const renderPicker = () => {
        const picker = document.getElementById("picker");
        picker.hidden = !state.choosing;
        if (picker.hidden) return;
        picker.replaceChildren(
          el("h2", {}, "Notify me when"),
          ...EVENTS.map((event) =>
            el("label", {},
              el("input", { type: "checkbox", checked: chosen().includes(event.id), onchange: (e) => {
                store(EVENTS_KEY, EVENTS.map((x) => x.id).filter((id) => (id === event.id ? e.target.checked : chosen().includes(id))));
                tick();
              } }),
              eventText(event),
              event.urgent ? el("span", { class: "muted" }, " · stays until dismissed") : null)),
          el("p", { class: "muted" }, notifyOn() ? "Esc closes this." : "Switch notify on to get them. Esc closes this."));
      };

      const notifyControl = () => {
        if (permission() === "denied") return el("span", { class: "muted", title: "Allow notifications for this page in the browser's site settings" }, "notify: blocked");
        const on = notifyOn();
        return el("button", { class: "link", type: "button", onclick: async () => {
          if (on) store(NOTIFY_KEY, false);
          else if ((await Notification.requestPermission()) === "granted") {
            store(NOTIFY_KEY, true);
            sendTest();
          }
          renderPicker();
          tick();
        } }, `notify: ${on ? "on" : "off"}`);
      };

      /* ── Status bar and polling ── */
      const tick = () => {
        const now = Date.now();
        const hint = document.getElementById("notify-hint");
        hint.textContent = notifyHint() ?? "";
        hint.hidden = !hint.textContent;
        for (const node of document.querySelectorAll("[data-since]")) node.textContent = FORMATS[node.dataset.format](now - time(node.dataset.since));
        const next = Math.max(0, Math.ceil((state.lastPoll + POLL_SECONDS * 1000 - now) / 1000));
        document.getElementById("poll-spinner").hidden = !state.loading;
        document.getElementById("freshness").textContent = [
          state.data ? `updated ${duration(now - time(state.data.generated_at))} ago` : null,
          state.loading ? "reading GitHub…" : document.hidden && !notifyOn() ? "paused while hidden" : `next poll ${next}s`,
        ].filter(Boolean).join(" · ");
        const rates = state.data?.rates ?? {};
        const percent = rates.core ? Math.round((100 * rates.core.remaining) / rates.core.limit) : 0;
        const count = (r) => `${r.remaining.toLocaleString("en")} of ${r.limit.toLocaleString("en")}`;
        document.getElementById("keys").replaceChildren(...[
          "r poll now",
          rates.core ? [" · ", el("span", { class: "budget", title: [
            `${count(rates.core)} REST calls left until ${new Date(rates.core.reset * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}; every tool using this account draws from them.`,
            rates.graphql ? `GraphQL: ${count(rates.graphql)} left.` : "",
            `This monitor: ${rates.counted} counted calls and ${rates.not_modified} free "not modified" answers.`,
          ].join(" ") }, "GH API budget", el("span", { class: `bar${percent < 20 ? " low" : ""}` }, el("span", { style: `width: ${percent}%` })), `${percent}%`)] : "",
          " · ", notifyControl(),
          permission() !== "denied" ? [" · ", el("button", { class: "link", type: "button", onclick: () => { state.choosing = !state.choosing; renderPicker(); } }, `notify when (${chosen().length})`)] : "",
        ].flat());
      };

      const poll = async (fresh = false) => {
        if (state.loading) return;
        state.loading = true;
        state.lastPoll = Date.now();
        tick();
        try {
          const response = await fetch(`snapshot.json${fresh ? "?fresh=1" : ""}`, { cache: "no-store" });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error ?? `HTTP ${response.status}`);
          notify(changesOf(data));
          state.data = data;
          state.error = null;
        } catch (error) {
          state.error = error.message;
        } finally {
          state.loading = false;
        }
        render();
      };

      // Ten frames a second, as in the terminal view; a steady dot for reduced motion.
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let frame = 0;
      setInterval(() => {
        frame = (frame + 1) % SPINNER.length;
        for (const node of document.querySelectorAll(".spinner")) node.textContent = reducedMotion.matches ? "●" : SPINNER[frame];
      }, 100);

      // With notifications on, a hidden tab keeps polling; browsers slow its timers.
      setInterval(() => {
        tick();
        if ((!document.hidden || notifyOn()) && Date.now() - state.lastPoll >= POLL_SECONDS * 1000) poll();
      }, 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Date.now() - state.lastPoll >= POLL_SECONDS * 1000) poll();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.choosing) {
          state.choosing = false;
          return renderPicker();
        }
        if (event.key === "r" && !event.metaKey && !event.ctrlKey && !event.altKey) poll(true);
      });
      poll();
    </script>
  </body>
</html>
