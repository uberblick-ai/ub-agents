<!doctype html>
<!--
  The ub-agents monitor: what needs a person, what runs now, what's next and what ended in
  the last 24 hours, on every machine that runs a launcher for the repositories.
  `ub-agents monitor` serves it on 127.0.0.1 and computes /snapshot.json with
  the launcher's own record rules; this page only draws it and notifies.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ub-agents</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cstyle%3E.tile%7Bfill%3A%231d1b24%7D%40media%20(prefers-color-scheme%3Adark)%7B.tile%7Bfill%3A%232c2937%7D%7D%3C%2Fstyle%3E%3Crect%20class%3D%22tile%22%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%2F%3E%3Cpath%20d%3D%22M32%208V17%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%228%22%20r%3D%224.5%22%20fill%3D%22%23bc7509%22%2F%3E%3Cpath%20d%3D%22M8%2027V37M56%2027V37%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2216%22%20width%3D%2240%22%20height%3D%2230%22%20rx%3D%228%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20class%3D%22tile%22%20x%3D%2217%22%20y%3D%2223%22%20width%3D%2230%22%20height%3D%2216%22%20rx%3D%226%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2231%22%20r%3D%224%22%20fill%3D%22%23bc7509%22%2F%3E%3Ccircle%20cx%3D%2239%22%20cy%3D%2231%22%20r%3D%224%22%20fill%3D%22%23bc7509%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2252%22%20width%3D%2246%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23bc7509%22%2F%3E%3C%2Fsvg%3E" />
    <style>
      /* The terminal palette (VIEW_THEME in view/theme.py). */
      :root {
        color-scheme: dark;
        --background: #0d1016;
        --panel: #161a22;
        --foreground: #d4d9e1;
        --muted: #6b7484;
        --border: #2a303b;
        --selection: #1b2030;
        --running: #6cb6ff;
        --accent: #b79cff;
        --success: #7ee2a0;
        --attention: #ff8b7f;
        --priority-urgent: #e0524a;
        --priority-high: #c98a86;
        --priority-low: #86a891;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --background: #f7f8fa;
          --panel: #ffffff;
          --foreground: #1d232c;
          --muted: #687284;
          --border: #d5dae2;
          --selection: #eceff5;
          --running: #1f6fd1;
          --accent: #7a55d6;
          --success: #18804a;
          --attention: #c8382c;
          --priority-urgent: #c8382c;
          --priority-high: #844b45;
          --priority-low: #1b5b3e;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      a, button, select { color: inherit; font: inherit; }
      main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 72px; }
      .muted { color: var(--muted); }
      .running { color: var(--running); }
      .success { color: var(--success); }
      .attention { color: var(--attention); }
      .priority-urgent { color: var(--priority-urgent); }
      .priority-high { color: var(--priority-high); }
      .priority-medium { color: var(--muted); }
      .priority-low { color: var(--priority-low); }
      /* A panel's title sits in its top border, as in the terminal view. */
      .panel {
        position: relative;
        margin-top: 26px;
        padding: 18px 16px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .panel > h2 {
        position: absolute;
        top: -0.8em;
        left: 12px;
        margin: 0;
        padding: 0 6px;
        background: var(--background);
        font-size: 13px;
        font-weight: 500;
      }
      .panel.attention-panel { border-color: var(--attention); }
      .panel.running-panel { border-color: var(--running); }
      .machine-picker, .needs-picker {
        position: absolute;
        top: -0.8em;
        right: 12px;
        max-width: calc(100% - 22ch);
        padding: 0 6px;
        background: var(--background);
      }
      .needs-picker { top: auto; bottom: -0.8em; max-width: calc(100% - 24px); }
      .needs.with-picker { padding-bottom: 20px; }
      .repository-picker { position: relative; display: inline-block; padding-right: 6px; max-width: 100%; }
      .machine-picker select, .needs-picker select, .repository-picker select {
        appearance: none;
        max-width: 100%;
        padding: 0 2ch 0 0;
        border: 0;
        background: var(--background);
        color: var(--muted);
        text-decoration: underline;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .machine-picker > span, .needs-picker > span, .repository-picker > span { position: absolute; right: 6px; pointer-events: none; }
      .row {
        display: grid;
        grid-template-columns: 2ch minmax(0, 1fr) 16ch 22ch 12ch;
        gap: 2px 14px;
        padding: 7px 8px;
        margin: 0 -8px;
      }
      .row + .row, details + details { border-top: 1px solid var(--border); }
      .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .right { text-align: right; }
      .sub, .block { grid-column: 2 / -1; color: var(--muted); }
      .block { white-space: normal; max-width: 110ch; }
      .needs .row { grid-template-columns: 2ch minmax(0, 1fr) auto; }
      .eligible-rows { max-height: 280px; overflow-y: auto; scrollbar-gutter: stable; }
      .eligible-rows:focus-visible { outline: 1px solid var(--success); }
      .eligible .row {
        grid-template-columns: 2ch minmax(0, 1fr) auto;
        grid-template-rows: 19.5px 19.5px;
        height: 56px;
        margin: 0;
      }
      .eligible .right { max-width: 40ch; }
      ul.block { margin: 6px 0 0; padding: 0; list-style: none; color: var(--foreground); }
      ul.block li::before { content: "→ "; color: var(--attention); }
      ol.block { margin: 2px 0 0; padding-left: 3ch; color: var(--foreground); }
      .item a { text-decoration: none; }
      .item a:hover { text-decoration: underline; }
      .ref { margin-right: 8px; font-weight: 600; }
      .discuss {
        margin-right: 12px;
        padding: 1px 8px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--accent);
        text-decoration: none;
      }
      details > summary { list-style: none; cursor: pointer; }
      details > summary::-webkit-details-marker { display: none; }
      details[open] > summary, details > summary:hover { background: var(--selection); }
      .detail { padding: 6px 8px 12px calc(2ch + 22px); margin: 0 -8px; background: var(--selection); }
      .detail p { margin: 0 0 8px; white-space: pre-wrap; max-width: 110ch; }
      .banner { margin-top: 14px; padding: 8px 12px; border: 1px solid var(--attention); color: var(--attention); }
      .hint { color: var(--accent); margin: 8px 0 0; }
      .status {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 24px;
        border-top: 1px solid var(--border);
        background: var(--background);
        white-space: nowrap;
      }
      /* The terminal view's spinner (view/spinner.py), shown while GitHub is read. */
      .spinner { display: inline-block; width: 2ch; color: var(--running); }
      .spinner[hidden] { display: none; }
      /* The GitHub REST budget left this hour, coral when it runs low. */
      .budget { display: inline-flex; align-items: center; gap: 6px; }
      .bar { display: inline-block; width: 8ch; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--success); }
      .bar.low > span { background: var(--attention); }
      .link { border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
      .picker { position: fixed; right: 24px; bottom: 44px; background: var(--panel); }
      .picker > h2 { background: var(--panel); }
      .picker label { display: flex; gap: 8px; padding: 2px 0; cursor: pointer; }
      .picker .stop-events { padding-left: 3ch; }
      @media (max-width: 860px) {
        .row { grid-template-columns: 2ch minmax(0, 1fr) auto; }
        .wide { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <strong>ub-agents</strong> <span class="muted" id="repository"></span>
      <p class="hint" id="notify-hint" hidden></p>
      <div id="app" class="muted"><span class="spinner">⠋</span>Reading coordination records…</div>
    </main>
    <div class="status" role="status">
      <span><span class="spinner" id="poll-spinner" hidden>⠋</span><span id="freshness"></span></span>
      <span id="keys"></span>
    </div>
    <section class="panel picker" id="picker" hidden></section>
    <script>
      "use strict";
      const POLL_SECONDS = 30;
      const NOTIFY_KEY = "ub-agents-monitor.notify";
      const EVENTS_KEY = "ub-agents-monitor.notify-events-v2";
      const MACHINE_KEY = "ub-agents-monitor.machine";
      const REPOSITORY_KEY = "ub-agents-monitor.repository";
      const DISMISSED_KEY = "ub-agents-monitor.dismissed-stops";
      const NEEDS_VIEW_KEY = "ub-agents-monitor.needs-view";
      const EVENTS = [
        { id: "started", text: "a run starts" },
        { id: "ended", text: "a run ends" },
        { id: "expired", text: "a run expires without a result" },
      ];
      // Each cause of a stop can notify on its own; the parent selects them all.
      const stopEvents = (data = state.data) => [
        { id: "blocked", text: "a run reports blocked", urgent: true },
        ...(data?.stop_outcomes ?? []).map(({ name, agents, repositories }) => ({ id: `outcome:${name}`, text: `a run reports ${name} (${agents.join(", ")}${repositories ? ` · ${repositories.join(", ")} only` : ""})`, urgent: true })),
        { id: "label", text: `${(data?.stop_labels ?? ["needs-human"]).join(" or ")} is added another way (by hand, or a round or attempt limit)`, urgent: true },
      ];
      const events = () => [...stopEvents(), ...EVENTS];
      // More ordinary notifications than this in one poll arrive as one summary.
      const NOTIFY_SINGLY = 3;
      const TEST_HINT_MS = 20_000;
      const SPINNER = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

      const stored = (key, fallback) => {
        try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
      };
      const store = (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* kept for this tab */ }
      };
      const keptMachine = stored(MACHINE_KEY, null);
      const keptRepository = stored(REPOSITORY_KEY, null);
      const keptDismissed = stored(DISMISSED_KEY, []);
      const state = { data: null, error: null, loading: false, lastPoll: 0, seen: null, seenRepositories: new Set(), open: new Set(), choosing: false, testSentAt: 0,
        dismissed: new Set(Array.isArray(keptDismissed) ? keptDismissed.filter((key) => typeof key === "string") : []),
        needsView: stored(NEEDS_VIEW_KEY, "open") === "dismissed" ? "dismissed" : "open",
        repository: typeof keptRepository === "string" && keptRepository ? keptRepository : null,
        machine: typeof keptMachine === "string" && keptMachine ? keptMachine : null };
      const time = (stamp) => new Date(stamp).getTime();

      // Identity belongs to one stop, even when labels alone explain it.
      const stopKey = (entry) => `${entry.item.repository}:${entry.item.number}:${JSON.stringify([entry.ask?.url ?? null, entry.notice ?? null, [...entry.labels].sort()])}`;
      const isDismissed = (entry) => state.dismissed.has(stopKey(entry));
      const openStops = (entries) => entries.filter((entry) => !isDismissed(entry));
      const pruneDismissals = (data) => {
        if (!data.repositories.every((source) => source.generated_at)) return;
        // Failed reads carry the server's last rows, so their dismissals survive.
        const current = new Set(data.needs_human.map(stopKey));
        const kept = [...state.dismissed].filter((key) => current.has(key));
        if (kept.length === state.dismissed.size) return;
        state.dismissed = new Set(kept);
        store(DISMISSED_KEY, kept);
      };

      const combinedOutcomes = (repositories) => {
        const outcomes = new Map();
        for (const repository of repositories) for (const { name, agents } of repository.stop_outcomes ?? []) {
          if (!outcomes.has(name)) outcomes.set(name, { name, agents: new Set(), repositories: [] });
          const outcome = outcomes.get(name);
          agents.forEach((agent) => outcome.agents.add(agent));
          outcome.repositories.push(repository.name);
        }
        return [...outcomes.values()].sort((a, b) => a.name.localeCompare(b.name)).map((outcome) => ({
          ...outcome, agents: [...outcome.agents].sort(),
          repositories: outcome.repositories.length === repositories.length ? null : outcome.repositories,
        }));
      };
      const combine = (snapshot, repository = null) => {
        const short = (repository) => repository.split("/").pop();
        const repositories = snapshot.repositories.map((source) => ({ ...source,
          name: snapshot.repositories.filter((other) => short(other.repository).toLowerCase() === short(source.repository).toLowerCase()).length > 1 ? source.repository : short(source.repository),
        })).filter((source) => repository === null || source.repository === repository);
        const rows = (key) => repositories.flatMap((source) => (source[key] ?? []).map((row) => ({ ...row,
          stop_outcomes: source.stop_outcomes ?? [],
          item: { ...row.item, repository: source.repository, repository_name: source.name, folder: source.folder },
        })));
        return { ...snapshot, repositories, multiple: repositories.length > 1,
          repository: repositories[0].repository, folder: repositories[0].folder,
          stop_labels: repositories.some((source) => source.generated_at)
            ? [...new Set(repositories.flatMap((source) => source.stop_labels ?? []))] : undefined,
          stop_outcomes: combinedOutcomes(repositories),
          needs_human: rows("needs_human"),
          running: rows("running").sort((a, b) => time(a.started) - time(b.started)),
          expired: rows("expired").sort((a, b) => time(a.expires) - time(b.expires)),
          recent: rows("recent").sort((a, b) => time(b.ended) - time(a.ended)),
          eligible: repositories[0].eligible,
        };
      };
      const titleOf = (data) => {
        const needs = openStops(data.needs_human);
        const rows = needs.length ? needs : data.running;
        const names = data.repositories.filter((source) => !rows.length || rows.some((row) => row.item.repository === source.repository)).map((source) => source.name);
        const repositories = names.length > 2 ? `${names[0]} +${names.length - 1}` : names.join(", ");
        return needs.length ? `(${rows.length}) needs human · ${repositories}`
          : data.running.length ? `${rows.length} running · ${repositories}` : repositories;
      };

      /* ── Drawing ── Text from GitHub is only ever set as text, never parsed as markup. */
      const el = (tag, props = {}, ...children) => {
        const node = document.createElement(tag);
        for (const [key, value] of Object.entries(props)) {
          if (value === undefined || value === null || value === false) continue;
          if (key === "class") node.className = value;
          else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
          else node.setAttribute(key, value === true ? "" : value);
        }
        node.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
        return node;
      };
      const link = (href, text) => el("a", { href, target: "_blank", rel: "noreferrer" }, text);
      const duration = (ms) => {
        const s = Math.max(0, Math.floor(ms / 1000));
        if (s < 60) return `${s}s`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m}m`;
        const h = Math.floor(m / 60);
        return h < 48 ? (m % 60 ? `${h}h ${m % 60}m` : `${h}h`) : `${Math.floor(h / 24)}d`;
      };
      const FORMATS = { ago: (ms) => `${duration(ms)} ago`, for: duration };
      // Times the per-second tick rewrites in place, so open rows and focus survive.
      const clock = (stamp, format) => el("span", { "data-since": stamp, "data-format": format }, FORMATS[format](Date.now() - time(stamp)));
      const machine = (host) => host && host === state.data?.local_host ? "this machine" : host || "unknown machine";
      const ref = (item) => `${item.kind === "pr" ? "PR " : ""}#${item.number}`;
      const itemLink = (item, showRepository = state.data?.multiple && state.repository === null) => el("div", { class: "cell item" }, link(item.url, [showRepository ? `${item.repository_name} ` : "", el("span", { class: "ref" }, ref(item)), item.title || ""]));
      const panel = (title, count, classes, children) =>
        el("section", { class: `panel ${classes}` }, el("h2", {}, title, el("span", { class: "muted" }, ` · ${count}`)), children);

      // Opens a Claude Code session in the Claude app, in this checkout, with the
      // prompt filled in: the app asks to confirm the folder, and the viewer sends it.
      const discussUrl = (item) => {
        const params = new URLSearchParams({ q: `help me unblock ${item.repository}#${item.number} using the ub-agents-unblock skill` });
        if (item.folder) params.set("folder", item.folder);
        return `claude://code/new?${params.toString().replace(/\+/g, "%20")}`;
      };

      const setNeedsView = (value) => {
        state.needsView = value;
        store(NEEDS_VIEW_KEY, value);
      };
      const toggleDismissal = (entry) => {
        const key = stopKey(entry);
        isDismissed(entry) ? state.dismissed.delete(key) : state.dismissed.add(key);
        store(DISMISSED_KEY, [...state.dismissed]);
        // Keep notification baselines intact: restoring a stop is quiet.
        render();
      };
      const needsPicker = (open, dismissed) => el("div", { class: "needs-picker muted" },
        el("select", { "aria-label": "Needs human view", onchange: (event) => {
          setNeedsView(event.target.value);
          render();
          document.querySelector('.needs-picker select').focus();
        } },
          el("option", { value: "open", selected: state.needsView === "open" }, `Open (${open})`),
          el("option", { value: "dismissed", selected: state.needsView === "dismissed" }, `Dismissed (${dismissed})`)),
        el("span", { "aria-hidden": "true" }, " ▾"));
      const needsRow = (entry, dismissed) => {
        const { item, labels, ask, notice } = entry;
        return el("div", { class: "row" },
          el("span", { class: "attention" }, "!"),
          itemLink(item),
          el("span", { class: "attention" }, labels.join(", ")),
          el("div", { class: "sub" }, ask ? [`${ask.agent}${ask.outcome ? ` · ${ask.outcome}` : ""} · `, clock(ask.created, "ago")] : "No outcome on record: read the item."),
          ask?.actions.length ? el("ul", { class: "block" }, ask.actions.map((a) => el("li", {}, a)))
            : ask?.summary ? el("div", { class: "block" }, ask.summary) : null,
          ask?.options.length ? [el("div", { class: "block" }, "Options, recommended first:"), el("ol", { class: "block" }, ask.options.map((o) => el("li", {}, o)))] : null,
          el("div", { class: "block" },
            el("a", { class: "discuss", href: discussUrl(item), title: "Opens a Claude Code session in this checkout with the unblock prompt filled in" }, "discuss with Claude"),
            notice ? [link(notice, "action needed"), " · "] : null,
            ask ? link(ask.url, "outcome record") : link(item.url, "open the item"),
            " · ", el("button", { class: "link", type: "button", onclick: () => toggleDismissal(entry) }, dismissed ? "restore" : "dismiss")));
      };
      const needsPanel = (entries, stopLabels, complete) => {
        const open = openStops(entries);
        const dismissed = entries.filter(isDismissed);
        if (!dismissed.length && state.needsView !== "open") setNeedsView("open");
        const showingDismissed = state.needsView === "dismissed";
        const shown = showingDismissed ? dismissed : open;
        const result = panel("Needs human", `${shown.length}${showingDismissed ? " dismissed" : ""}`,
          `needs${open.length ? " attention-panel" : ""}${dismissed.length ? " with-picker" : ""}`,
          shown.length ? shown.map((entry) => needsRow(entry, showingDismissed))
            : !complete ? el("div", { class: "muted" }, "Some repositories have not been read yet.")
            : el("div", { class: "muted" }, el("span", { class: "success" }, "✓ "), `Nothing waits for a person · stop labels: ${stopLabels.join(", ")}`));
        if (dismissed.length) result.append(needsPicker(open.length, dismissed.length));
        return result;
      };

      const runRow = (run, glyph, tone, last) =>
        el("div", { class: "row" },
          el("span", { class: tone }, glyph),
          itemLink(run.item),
          el("div", { class: "cell wide" }, run.agent),
          el("div", { class: "cell wide" }, machine(run.host)),
          last,
          el("div", { class: "sub" }, `attempt ${run.attempt} · ${run.runtime} · by ${run.actor}`));

      const repositoryPicker = () => el("span", { class: "repository-picker" },
        el("select", { "aria-label": "Repository", onchange: (event) => {
          state.repository = event.target.value || null;
          store(REPOSITORY_KEY, state.repository);
          render();
          document.querySelector('.repository-picker select').focus();
        } },
          el("option", { value: "", selected: state.repository === null }, `All repositories (${state.data.repositories.length})`),
          state.data.repositories.map((source) => el("option", { value: source.repository, selected: state.repository === source.repository }, source.name))),
        el("span", { "aria-hidden": "true" }, "▾"));

      const machinePicker = (data) => {
        const others = new Set([...data.running, ...data.recent].map((run) => run.host).filter(Boolean));
        if (state.machine) others.add(state.machine);
        others.delete(data.local_host);
        const hosts = [data.local_host, ...[...others].sort()];
        return el("div", { class: "machine-picker muted" },
          el("select", { "aria-label": "Running machine", onchange: (event) => {
            state.machine = event.target.value || null;
            store(MACHINE_KEY, state.machine);
            render();
            document.querySelector('.machine-picker select').focus();
          } },
            el("option", { value: "", selected: state.machine === null }, `All Machines (${hosts.length})`),
            hosts.map((host) => el("option", { value: host, selected: state.machine === host }, machine(host)))),
          el("span", { "aria-hidden": "true" }, "▾"));
      };

      const runningPanel = (runs, data) => {
        const shown = state.machine === null ? runs : runs.filter((run) => run.host === state.machine);
        const result = panel("Running", shown.length, shown.length ? "running-panel" : "",
          shown.length
            ? shown.map((run) => runRow(run, SPINNER[frame], "spinner", el("div", { class: "cell right running", title: run.renewed ? `renewed ${new Date(run.renewed).toLocaleTimeString()}` : null },
                run.state === "claiming" ? "claiming" : clock(run.started, "for"))))
            : el("div", { class: "muted" }, `Idle · nothing running on ${state.machine === null ? "any machine" : machine(state.machine)}`));
        result.append(machinePicker(data));
        return result;
      };

      const eligibleState = (row) => {
        const pauses = Object.entries(row.pauses).filter(([, end]) => time(end) > Date.now());
        if (row.state !== "waiting" || !pauses.length || pauses.length !== Object.keys(row.pauses).length) return row.state;
        let minutes = Math.max(1, Math.ceil((Math.min(...pauses.map(([, end]) => time(end))) - Date.now()) / 60000));
        let days = Math.floor(minutes / 1440);
        let hours = Math.floor(minutes % 1440 / 60);
        minutes %= 60;
        if (days && hours && minutes) {
          hours += 1;
          days += Math.floor(hours / 24);
          hours %= 24;
          minutes = 0;
        }
        const remaining = [[days, "d"], [hours, "h"], [minutes, "m"]].filter(([n]) => n).map(([n, unit]) => `${n}${unit}`).join(" ");
        return `${pauses.map(([cli]) => cli).join(", ")} paused ${remaining}`;
      };
      const eligibleRows = (eligible) => eligible.rows.map((row) => el("div", { class: "row" },
        el("span", { class: row.glyph === "●" ? "success" : "muted" }, row.glyph),
        itemLink(row.item, false),
        el("div", { class: "cell right muted" }, eligibleState(row)),
        el("div", { class: "sub cell" },
          row.agents.map((agent) => `${agent.name}${agent.failures ? ` · ${agent.failures}/${agent.max_attempts} failures` : ""}`).join(", "),
          row.priority ? [" · ", el("span", { class: `priority-${row.priority}` }, row.priority)] : null)));
      const eligiblePanel = (eligible) => {
        if (!eligible) return panel("Eligible", "unavailable", "eligible", el("div", { class: "muted" }, "Planning unavailable"));
        const count = `${eligible.count}${eligible.count > eligible.rows.length ? ` · showing ${eligible.rows.length}` : ""}`;
        const result = panel("Eligible", count, "eligible", eligible.rows.length
          ? el("div", { class: "eligible-rows", id: "eligible-rows", tabindex: "0", "aria-label": "Eligible items" },
              eligibleRows(eligible))
          : el("div", { class: "muted" }, "Nothing eligible"));
        result.querySelector("h2").title = `Planned every ${eligible.interval_seconds / 60} minutes; last planned ${new Date(eligible.generated_at).toLocaleTimeString()}.`;
        return result;
      };
      const eligibleGroups = (repositories) => {
        const groups = repositories.filter((source) => !source.eligible || source.eligible.count);
        const count = repositories.reduce((sum, source) => sum + (source.eligible?.count ?? 0), 0);
        const shown = groups.reduce((sum, source) => sum + (source.eligible?.rows.length ?? 0), 0);
        return panel("Eligible", `${count}${count > shown ? ` · showing ${shown}` : ""}`, "eligible", groups.length
          ? el("div", { class: "eligible-rows", id: "eligible-rows", tabindex: "0", "aria-label": "Eligible items" },
              groups.map((source) => [el("div", { class: "muted", title: source.eligible ? `Planned every ${source.eligible.interval_seconds / 60} minutes; last planned ${new Date(source.eligible.generated_at).toLocaleTimeString()}.` : "" }, source.name),
                source.eligible ? eligibleRows(source.eligible) : el("div", { class: "muted" }, "Planning unavailable")]))
          : el("div", { class: "muted" }, "Nothing eligible"));
      };

      const expiredPanel = (runs) =>
        runs.length
          ? panel("Expired without a result", runs.length, "attention-panel", [
              el("div", { class: "muted" }, "Their launcher stopped renewing them. The next launcher that picks the item up recovers it."),
              runs.map((run) => runRow(run, "×", "attention", el("div", { class: "cell right muted" }, clock(run.expires, "ago")))),
            ])
          : null;

      const recentPanel = (runs) => {
        const cost = runs.reduce((sum, run) => sum + (run.cost ?? 0), 0);
        const tone = (run) => ({ success: "success", blocked: "attention", retry: "attention" })[run.status] ?? "muted";
        const usage = (run) => [run.tokens == null ? "" : `${Math.round(run.tokens / 1000)}k tokens`, run.cost == null ? "" : `$${run.cost.toFixed(2)}`].filter(Boolean).join(" · ");
        return panel("Recent activity", `${runs.length} runs · $${cost.toFixed(2)} · last 24 h`, "",
          runs.length
            ? runs.map((run) =>
                el("details", { open: state.open.has(runKey(run)), ontoggle: (e) => (e.target.open ? state.open.add(runKey(run)) : state.open.delete(runKey(run))) },
                  el("summary", { class: "row" },
                    el("span", { class: tone(run) }, { success: "✓", blocked: "⏸", retry: "×" }[run.status] ?? "·"),
                    itemLink(run.item),
                    el("div", { class: `cell wide ${tone(run)}` }, run.result),
                    el("div", { class: "cell wide" }, `${machine(run.host)} · ${duration(time(run.ended) - time(run.started))}`),
                    el("div", { class: "cell right muted" }, clock(run.ended, "ago")),
                    el("div", { class: "sub cell" }, `${run.agent} · ${run.summary || "no summary"}`)),
                  el("div", { class: "detail" },
                    run.summary ? el("p", {}, run.summary) : null,
                    el("div", { class: "muted" }, `${run.agent} · ${machine(run.host)} · attempt ${run.attempt} · ${run.runtime} · by ${run.actor}`, usage(run) ? ` · ${usage(run)}` : "", " · ", link(run.url, "coordination record")))))
            : el("div", { class: "muted" }, "No runs ended in the last 24 hours."));
      };

      const render = () => {
        const app = document.getElementById("app");
        // Notifications keep the complete snapshot; only drawing uses this view.
        const data = state.data && (state.repository ? combine(state.data, state.repository) : state.data);
        if (!data) {
          app.replaceChildren(...(state.error ? [el("div", { class: "banner" }, `Couldn't read GitHub: ${state.error}`)] : [el("span", { class: "spinner" }, SPINNER[0]), "Reading coordination records…"]));
          return tick();
        }
        app.className = "";
        document.getElementById("repository").replaceChildren("· ", state.data.multiple ? repositoryPicker() : data.repository);
        if (!data.repositories.some((source) => source.generated_at)) {
          document.title = "ub-agents";
          const error = state.error ?? data.repositories.map((source) => `${data.multiple ? `${source.name}: ` : ""}${source.error}`).join("; ");
          app.replaceChildren(el("div", { class: "banner" }, `Couldn't read GitHub: ${error}`));
          renderPicker();
          return tick();
        }
        document.title = titleOf(data);
        const eligibleScroll = document.getElementById("eligible-rows")?.scrollTop ?? 0;
        app.replaceChildren(
          state.error ? el("div", { class: "banner" }, `Couldn't refresh: ${state.error}. Showing the last result.`) : "",
          ...data.repositories.flatMap((source) => [
            source.error ? el("div", { class: "banner" }, `${data.multiple ? `${source.name}: ` : ""}Couldn't refresh: ${source.error}. ${source.generated_at ? (data.multiple ? "Showing its last result; other repositories are current." : "Showing the last result.") : "No successful read yet."}`) : "",
            source.eligible_error ? el("div", { class: "banner" }, `${data.multiple ? `${source.name}: ` : ""}Couldn't refresh: Eligible: ${source.eligible_error}. ${source.eligible ? "Showing the last Eligible result. " : ""}Other panels are current.`) : "",
            ...(source.notices ?? []).map((notice) => el("div", { class: "banner" }, `${data.multiple ? `${source.name}: ` : ""}${notice}`)),
          ]),
          needsPanel(data.needs_human, data.stop_labels, data.repositories.every((source) => source.generated_at)),
          runningPanel(data.running, data),
          data.multiple ? eligibleGroups(data.repositories) : eligiblePanel(data.eligible),
          expiredPanel(data.expired) ?? "",
          recentPanel(data.recent));
        if (document.getElementById("eligible-rows")) document.getElementById("eligible-rows").scrollTop = eligibleScroll;
        renderPicker();
        tick();
      };

      /* ── Notifications ── */
      const chosen = () => stored(EVENTS_KEY, stopEvents().map((e) => e.id)).filter((id) => events().some((e) => e.id === id));
      const eventText = (event) => event.text;
      const permission = () => ("Notification" in window ? Notification.permission : "denied");
      const notifyOn = () => stored(NOTIFY_KEY, false) && permission() === "granted";

      // What a poll found that could notify, by event. The first poll sets the
      // baseline: nothing notifies on load.
      const stopEvent = (entry, data) => {
        if (!entry.labelled) return "blocked";
        return entry.stop_outcomes.some(({ name }) => name === entry.ask?.outcome) ? `outcome:${entry.ask.outcome}` : "label";
      };
      const runKey = (run) => `${run.item.repository}:${run.id}`;
      const keysOf = (data) => ({
        ...Object.fromEntries(stopEvents(data).map(({ id }) => [id,
          new Set(data.needs_human.filter((e) => stopEvent(e, data) === id).map(stopKey))])),
        started: new Set(data.running.map(runKey)),
        ended: new Set(data.recent.map(runKey)),
        expired: new Set(data.expired.map(runKey)),
      });
      const changesOf = (data) => {
        const keys = keysOf(data);
        const before = state.seen;
        const known = state.seenRepositories;
        state.seenRepositories = new Set([...known, ...data.repositories.filter((source) => source.generated_at).map((source) => source.repository)]);
        state.seen = keys;
        if (!before) return [];
        // An event the previous poll didn't know, after a config change, starts its own baseline.
        const fresh = (event, key) => known.has(key.split(":")[0]) && Boolean(before[event]) && !before[event].has(key);
        const change = (event, item, title, body) => ({ event, item, title: `${title} · ${item.repository_name} ${ref(item)} ${item.title}`, body });
        const ask = (entry) => entry.ask?.actions[0] || entry.ask?.summary || "The loop stopped on it until a person answers.";
        return [
          ...data.needs_human.filter((e) => !isDismissed(e) && fresh(stopEvent(e, data), stopKey(e)))
            .map((e) => change(stopEvent(e, data), e.item, stopEvent(e, data).startsWith("outcome:") ? e.ask.outcome : e.labels.join(", "), ask(e))),
          ...data.expired.filter((r) => fresh("expired", runKey(r))).map((r) => change("expired", r.item, "expired", `${r.agent} on ${machine(r.host)} stopped renewing its run.`)),
          ...data.recent.filter((r) => fresh("ended", runKey(r))).map((r) => change("ended", r.item, r.result, [r.agent, r.summary].filter(Boolean).join(" · "))),
          ...data.running.filter((r) => fresh("started", runKey(r))).map((r) => change("started", r.item, "started", `${r.agent} on ${machine(r.host)}`)),
        ];
      };

      // A tag of its own for every notification: a reused tag replaces the
      // earlier one without showing the new one.
      let serial = 0;
      const show = ({ title, body, url, urgent }) => {
        const notification = new Notification(title, { body, tag: `ub-agents:${Date.now()}:${serial++}`, requireInteraction: Boolean(urgent) });
        notification.onclick = () => {
          window.focus();
          if (url) window.open(url, "_blank", "noreferrer");
          notification.close();
        };
      };
      const notify = (changes) => {
        if (!notifyOn()) return;
        const wanted = changes.filter((c) => chosen().includes(c.event)).map((c) => ({ ...c, url: c.item.url, urgent: events().find((e) => e.id === c.event).urgent }));
        // One notification per item and poll, its most urgent change winning.
        const byItem = new Map();
        for (const change of wanted) if (!byItem.has(change.url) || (change.urgent && !byItem.get(change.url).urgent)) byItem.set(change.url, change);
        const urgent = [...byItem.values()].filter((c) => c.urgent);
        const ordinary = [...byItem.values()].filter((c) => !c.urgent);
        urgent.forEach(show);
        if (ordinary.length <= NOTIFY_SINGLY) ordinary.forEach(show);
        else show({ title: `${ordinary.length} changes · ub-agents`, body: ordinary.map((c) => c.title).join("\n") });
      };

      // The browser accepts a notification even when the system won't show it,
      // so switching them on sends a test and says where to look.
      const sendTest = () => {
        const what = events().filter((e) => chosen().includes(e.id)).map(eventText).join(", or when ");
        show({ title: "ub-agents monitor", body: `Notifications are on. You'll get one when ${what || "nothing: choose what to be notified about"}.` });
        state.testSentAt = Date.now();
      };
      const notifyHint = () => {
        if (Date.now() - state.testSentAt >= TEST_HINT_MS) return null;
        return /Mac/.test(navigator.userAgent)
          ? "Sent a test notification. Nothing showed up? Open System Settings › Notifications, find this browser and turn on Allow notifications; also check that Focus is off."
          : "Sent a test notification. Nothing showed up? Check the system's notification settings for this browser.";
      };

      const renderPicker = () => {
        const picker = document.getElementById("picker");
        picker.hidden = !state.choosing;
        if (picker.hidden) return;
        const stops = stopEvents().map((e) => e.id);
        const inputs = new Map();
        const update = () => {
          const selected = chosen();
          for (const [id, input] of inputs) input.checked = selected.includes(id);
          parent.checked = stops.every((id) => selected.includes(id));
          parent.indeterminate = !parent.checked && stops.some((id) => selected.includes(id));
        };
        const choose = (ids, checked) => {
          const selected = new Set(chosen());
          for (const id of ids) checked ? selected.add(id) : selected.delete(id);
          store(EVENTS_KEY, [...selected]);
          update();
          tick();
        };
        const parent = el("input", { type: "checkbox", onchange: (e) => choose(stops, e.target.checked) });
        const row = (event) => {
          const input = el("input", { type: "checkbox", onchange: (e) => choose([event.id], e.target.checked) });
          inputs.set(event.id, input);
          return el("label", {}, input, eventText(event));
        };
        picker.replaceChildren(
          el("h2", {}, "Notify me when"),
          el("label", {}, parent, "a person is needed", el("span", { class: "muted" }, " · stays until dismissed")),
          el("div", { class: "stop-events", role: "group", "aria-label": "a person is needed" }, stopEvents().map(row)),
          ...EVENTS.map(row),
          el("p", { class: "muted" }, notifyOn() ? "Esc or a click outside closes this." : "Switch notify on to get them. Esc or a click outside closes this."));
        update();
      };

      const notifyControl = () => {
        if (permission() === "denied") return el("span", { class: "muted", title: "Allow notifications for this page in the browser's site settings" }, "notify: blocked");
        const on = notifyOn();
        return el("button", { class: "link", type: "button", onclick: async () => {
          if (on) store(NOTIFY_KEY, false);
          else if ((await Notification.requestPermission()) === "granted") {
            store(NOTIFY_KEY, true);
            sendTest();
          }
          renderPicker();
          tick();
        } }, `notify: ${on ? "on" : "off"}`);
      };

      /* ── Status bar and polling ── */
      const tick = () => {
        const now = Date.now();
        const hint = document.getElementById("notify-hint");
        hint.textContent = notifyHint() ?? "";
        hint.hidden = !hint.textContent;
        for (const node of document.querySelectorAll("[data-since]")) node.textContent = FORMATS[node.dataset.format](now - time(node.dataset.since));
        const next = Math.max(0, Math.ceil((state.lastPoll + POLL_SECONDS * 1000 - now) / 1000));
        document.getElementById("poll-spinner").hidden = !state.loading;
        document.getElementById("freshness").textContent =
          state.loading ? "reading GitHub…" : document.hidden && !notifyOn() ? "paused while hidden" : `next poll ${next}s`;
        const rates = state.data?.rates ?? {};
        const percent = rates.core ? Math.round((100 * rates.core.remaining) / rates.core.limit) : 0;
        const count = (r) => `${r.remaining.toLocaleString("en")} of ${r.limit.toLocaleString("en")}`;
        document.getElementById("keys").replaceChildren(...[
          "r poll now",
          rates.core ? [" · ", el("span", { class: "budget", title: [
            `${count(rates.core)} REST calls left until ${new Date(rates.core.reset * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}; every tool using this account draws from them.`,
            rates.graphql ? `GraphQL: ${count(rates.graphql)} left.` : "",
            `This monitor: ${rates.counted} counted REST calls, ${rates.graphql_calls} GraphQL calls and ${rates.not_modified} free "not modified" answers.`,
          ].join(" ") }, "GH API budget", el("span", { class: `bar${percent < 20 ? " low" : ""}` }, el("span", { style: `width: ${percent}%` })), `${percent}%`)] : "",
          " · ", notifyControl(),
          permission() !== "denied" ? [" · ", el("button", { id: "notify-when", class: "link", type: "button", onclick: () => { state.choosing = !state.choosing; renderPicker(); } }, `notify when (${chosen().length})`)] : "",
        ].flat());
      };

      const poll = async (fresh = false) => {
        if (state.loading) return;
        state.loading = true;
        state.lastPoll = Date.now();
        tick();
        try {
          const response = await fetch(`snapshot.json${fresh ? "?fresh=1" : ""}`, { cache: "no-store" });
          const snapshot = await response.json();
          if (!response.ok) throw new Error(snapshot.error ?? `HTTP ${response.status}`);
          const data = combine(snapshot);
          pruneDismissals(data);
          if (state.repository && !data.repositories.some((source) => source.repository === state.repository)) {
            state.repository = null;
            store(REPOSITORY_KEY, null);
          }
          notify(changesOf(data));
          state.data = data;
          state.error = null;
        } catch (error) {
          state.error = error.message;
        } finally {
          state.loading = false;
        }
        render();
      };

      // Ten frames a second, as in the terminal view; a steady dot for reduced motion.
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      let frame = 0;
      setInterval(() => {
        frame = (frame + 1) % SPINNER.length;
        for (const node of document.querySelectorAll(".spinner")) node.textContent = reducedMotion.matches ? "●" : SPINNER[frame];
      }, 100);

      // With notifications on, a hidden tab keeps polling; browsers slow its timers.
      setInterval(() => {
        tick();
        if ((!document.hidden || notifyOn()) && Date.now() - state.lastPoll >= POLL_SECONDS * 1000) poll();
      }, 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Date.now() - state.lastPoll >= POLL_SECONDS * 1000) poll();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && state.choosing) {
          state.choosing = false;
          return renderPicker();
        }
        if (event.key === "r" && !event.metaKey && !event.ctrlKey && !event.altKey) poll(true);
      });
      document.addEventListener("click", (event) => {
        if (state.choosing && !event.target.closest("#picker, #notify-when")) {
          state.choosing = false;
          renderPicker();
        }
      });
      poll();
    </script>
  </body>
</html>
