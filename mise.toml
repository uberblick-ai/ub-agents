# In this repository `ub-agents` runs this checkout's code, never an installed
# release. .venv holds an editable install; with `mise activate`, entering the
# directory runs `setup` when .venv/bin/ub-agents is missing or older than
# pyproject.toml, then shows the interactive welcome card.
[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install this checkout into .venv in editable mode"
sources = ["pyproject.toml"]
outputs = [".venv/bin/ub-agents"]
quiet = true
run = [
  "echo 'Installing this checkout into .venv' >&2",
  "python3 -m venv .venv",
  ".venv/bin/python -m pip install -q --disable-pip-version-check -e .",
]

[tasks.ci]
description = "Optional local CI: verify a commit in a fresh worktree before pushing"
usage = 'arg "[commit]" help="Commit to verify" default="HEAD"'
run = 'sh "{{config_root}}/bin/ci.sh" "${usage_commit:-HEAD}"'

[tasks.release]
description = "Maintainers: publish a prepared release and open its Homebrew tap PR"
# The preflight and formula test need python3.15 even without a global mise default.
tools = { python = "3.15" }
usage = 'arg "<version>" help="Prepared version X.Y.Z"'
run = 'python3 "{{config_root}}/bin/release.py" "${usage_version?}"'

[tasks."diagrams:install"]
description = "Install the pinned diagram renderer and browser bundler locally"
run = "npm install --prefix site/diagrams --no-save --package-lock=false --ignore-scripts @uberblick/ablauf@0.3.0 esbuild@0.25.12"

[tasks.diagrams]
description = "Render committed diagrams and bundle ablauf playback for the site"
depends = ["diagrams:install"]
run = "node site/diagrams/render.mjs"

[tasks.remote-loop]
description = "Attach to a remote loop, or inspect/start/stop/drain it"
quiet = true
usage = '''
arg "<loop>" help="Remote loop name"
arg "[action]" help="Action to perform" default="attach" {
  choices "attach" "status" "logs" "start" "stop" "drain"
}
'''
run = 'python3 "{{config_root}}/bin/remote-loop.py" "${usage_loop?}" "${usage_action:-attach}"'

[tasks.welcome]
description = "Show the checkout's local and remote command card"
quiet = true
run = 'python3 "{{config_root}}/bin/welcome.py"'

[hooks]
enter = [
  { task = "setup" },
  'python3 "{{config_root}}/bin/welcome.py" --on-enter',
]
