name: Test
# Linux only: GitHub bills macOS minutes at ten times the Linux rate, so
# macOS is covered by running the suite on a Mac locally.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: ub-agents --version
      - run: ub-agents check
      - run: python -m pip install -e '.[ui]'
      - run: python -m unittest discover -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_package.py dist/*.whl
