name: Test
# Gates merges and releases: the main ruleset requires the `Test result` check,
# and bin/release.py requires a green run on the release commit. Local
# `mise run ci` (AGENTS.md) is an optional check before pushing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a PR supersedes its running checks; runs on main all finish.
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    # Leave time for the runner's five-minute limit and stack/process cleanup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m tests
      - run: ub-agents --version
      - run: ub-agents doctor --offline
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_package.py dist/*.whl
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Release preflight checks the whole workflow; reporting failures are optional.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e . coverage==7.17.0
      - run: coverage run -m tests
      - run: coverage combine
      - name: Summarize coverage
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
  coverage-report:
    needs: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Publish coverage report
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
  result:
    # One required check, so the matrix can change without editing the ruleset.
    name: Test result
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
