name: Test
# Local CI (`mise run ci`, AGENTS.md) gates merges. This Linux run follows each
# merge to main, and can be started from the Actions tab, to catch what only
# Linux shows. GitHub bills macOS minutes at ten times the Linux rate, so macOS
# is covered by local CI on a Mac.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m tests
      - run: ub-agents --version
      - run: ub-agents check
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_package.py dist/*.whl
