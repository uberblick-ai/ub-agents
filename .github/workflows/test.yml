name: Test
# Gates merges and releases: the main ruleset requires the `Test result` check,
# and bin/release.py requires a green run on the release commit. Local
# `mise run ci` (AGENTS.md) is an optional check before pushing.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a PR supersedes its running checks; runs on main all finish.
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: ruff check src
      - run: mypy
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    # Leave time for the runner's five-minute limit and stack/process cleanup.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m tests
      - run: ub-agents --version
      - run: ub-agents doctor --offline
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/check_package.py dist/*.whl
  result:
    # One required check, so the matrix can change without editing the ruleset.
    name: Test result
    if: always()
    needs: [static, tests]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static.result }}" = success
      - run: test "${{ needs.tests.result }}" = success
