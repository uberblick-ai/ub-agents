# One launcher. Copy env.example to .env and fill it in, then pick how it runs:
#   docker compose up -d                                          # no Docker inside
#   docker compose -f compose.yaml -f compose.sysbox.yaml up -d   # Linux host with Sysbox
#   docker compose -f compose.yaml -f compose.privileged.yaml up -d   # dedicated VM only
# Then: docker attach ub-agents-launcher (detach with Ctrl-p Ctrl-q)
services:
  launcher:
    build: .
    image: ub-agents-launcher:local
    container_name: ub-agents-launcher
    hostname: ${UB_AGENTS_HOST:-docker-launcher}
    env_file: .env
    tty: true
    stdin_open: true
    restart: unless-stopped
    volumes:
      - home:/home/agent
      - work:/work
    read_only: true
    tmpfs: ["/tmp:exec,mode=1777", /run, /var/log]
    # The entrypoint starts as root and drops to the agent user.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 8192
    mem_limit: 12g
volumes:
  home:
  work:
