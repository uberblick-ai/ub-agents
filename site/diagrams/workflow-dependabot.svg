.ab .k-stop.panel{stroke-width:1.2;stroke-dasharray:5 4}
.ab.ab-auto{--play:var(--ab-play,#0a7a60);--play-done:var(--ab-play-done,#596e81);}@media (prefers-color-scheme:dark){.ab.ab-auto{--play:var(--ab-play,#6ff0cf);--play-done:var(--ab-play-done,#5f9e8a);}}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-played :is(rect:not(.gap),path:not(.arrow),line){stroke:var(--play-done)}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-played :is(text,circle){fill:var(--play-done)}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-played .arrow{marker-end:url(#workflow-dependabot-play-played)}.ab .play-head-played{fill:var(--play-done)}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-current :is(rect:not(.gap),path:not(.arrow),line){stroke:var(--play)}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-current :is(text,circle){fill:var(--play)}.ab[data-ab-play="workflow-dependabot"] [data-ab-part].ab-current .arrow{marker-end:url(#workflow-dependabot-play-current)}.ab .play-head-current{fill:var(--play)}.ab[data-ab-play="workflow-dependabot"].ab-in-progress [data-ab-part]:not(.ab-current):not(.ab-played):not(:has(.gap)){opacity:.3}.ab[data-ab-play="workflow-dependabot"].ab-in-progress [data-ab-part]:not(.ab-current):not(.ab-played):has(.gap) text{opacity:.3}
