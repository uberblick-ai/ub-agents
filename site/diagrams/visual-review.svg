<line x1="8" y1="474" x2="647" y2="474" class="rule"/>
<g><rect x="16" y="488" width="24" height="12" rx="6" class="pill"/><circle cx="23" cy="494" r="3" class="t-done"/><text x="46" y="498" class="s11 muted">GitHub label, like ready</text></g>
<g><rect x="212" y="488" width="24" height="12" rx="3" class="k-stop panel"/><text x="242" y="498" class="s11 muted">human involved</text></g>
</svg>
