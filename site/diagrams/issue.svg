<g><rect x="22" y="16" width="223" height="38" rx="10" class="k-muted panel"/>
<text x="134" y="41" text-anchor="middle" class="s12 b">A team member writes an issue</text></g>
<g><rect x="55" y="92" width="158" height="34" rx="17" class="pill"/>
<circle cx="69" cy="109" r="5" class="t-muted"/>
<text x="81" y="113" class="m s12">needs-preparation</text></g>
<g><rect x="19" y="156" width="229" height="56" rx="10" class="k-muted panel"/>
<text x="134" y="181" text-anchor="middle" class="s12 b">The loop</text>
<text x="134" y="199" text-anchor="middle" class="s11 muted">claims eligible items in order</text></g>
<g>
<rect x="16" y="250" width="235" height="61" rx="8" class="k-agent"/>
<text x="134" y="269" text-anchor="middle" class="m s13 b t-agent">issue-preparer</text>
<text x="134" y="286" text-anchor="middle" class="s11 muted">grounds it in the code, challenges</text>
<text x="134" y="301" text-anchor="middle" class="s11 muted">assumptions, aims for an MVP</text>
</g>
<g><rect x="98" y="349" width="72" height="34" rx="17" class="pill"/>
<circle cx="112" cy="366" r="5" class="t-done"/>
<text x="124" y="370" class="m s12">ready</text></g>
<rect x="47" y="413" width="174" height="34" rx="17" class="k-done"/>
<text x="134" y="434" text-anchor="middle" class="s12 b t-done">Delivery picks it up</text>
<g><rect x="491" y="243" width="209" height="74" rx="10" class="k-stop panel"/>
<rect x="539" y="255" width="115" height="30" rx="15" class="pill"/>
<circle cx="553" cy="270" r="5" class="t-stop"/>
<text x="565" y="274" class="m s12">needs-human</text>
<text x="596" y="304" text-anchor="middle" class="s12 b">A person reviews or answers</text></g>
<text x="144" y="77" class="m s11">someone sets it</text>
<text x="144" y="235" class="m s11">starts the agent</text>
<text x="144" y="334" class="m s11">successfully prepared; acceptance criteria set</text>
<text x="261" y="274" class="m s11 t-stop">needs-human, blocked</text>
<text x="223" y="102" class="m s11 t-stop">comment on GitHub, remove needs-human, re-add the label</text>
<line x1="8" y1="463" x2="708" y2="463" class="rule"/>
<g><rect x="16" y="477" width="24" height="12" rx="6" class="pill"/><circle cx="23" cy="483" r="3" class="t-done"/><text x="46" y="487" class="s11 muted">GitHub label, like ready</text></g>
<g><rect x="212" y="477" width="24" height="12" rx="3" class="k-stop panel"/><text x="242" y="487" class="s11 muted">human involved</text></g>
