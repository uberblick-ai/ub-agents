<text x="20" y="22" class="cap">EACH ISSUE</text>
<text x="20" y="407" class="cap">THE MILESTONE</text>
<g data-ab-part="node-0"><g>
<rect x="275" y="16" width="229" height="46" rx="8" class="k-neutral"/>
<text x="390" y="35" text-anchor="middle" class="m s13 b t-neutral">Team member</text>
<text x="390" y="52" text-anchor="middle" class="s11 muted">files an issue in a milestone</text>
</g></g>
<g data-ab-part="node-1"><g>
<rect x="275" y="100" width="229" height="61" rx="8" class="k-agent"/>
<text x="390" y="119" text-anchor="middle" class="m s13 b t-agent">issue-preparer</text>
<text x="390" y="136" text-anchor="middle" class="s11 muted">prepares it, attaches the ready</text>
<text x="390" y="151" text-anchor="middle" class="s11 muted">label</text>
</g></g>
<g data-ab-part="node-2"><g>
<rect x="275" y="199" width="229" height="61" rx="8" class="k-agent"/>
<text x="390" y="218" text-anchor="middle" class="m s13 b t-agent">implementer</text>
<text x="390" y="235" text-anchor="middle" class="s11 muted">builds the change, opens its PR</text>
<text x="390" y="250" text-anchor="middle" class="s11 muted">into the milestone branch</text>
</g></g>
<g data-ab-part="node-3"><g>
<rect x="722" y="199" width="211" height="61" rx="8" class="k-agent"/>
<text x="828" y="218" text-anchor="middle" class="m s13 b t-agent">create the branch</text>
<text x="828" y="235" text-anchor="middle" class="s11 muted">from main, on the milestone's</text>
<text x="828" y="250" text-anchor="middle" class="s11 muted">first issue</text>
</g></g>
<g data-ab-part="node-4"><g>
<rect x="275" y="298" width="229" height="61" rx="8" class="k-agent"/>
<text x="390" y="317" text-anchor="middle" class="m s13 b t-agent">reviewer + integrator</text>
<text x="390" y="334" text-anchor="middle" class="s11 muted">merges the PR into the milestone</text>
<text x="390" y="349" text-anchor="middle" class="s11 muted">branch, closes the issue</text>
</g></g>
<g data-ab-part="node-5"><g>
<rect x="722" y="298" width="211" height="61" rx="8" class="k-agent"/>
<text x="828" y="317" text-anchor="middle" class="m s13 b t-agent">update the branch</text>
<text x="828" y="334" text-anchor="middle" class="s11 muted">merges main into the milestone</text>
<text x="828" y="349" text-anchor="middle" class="s11 muted">branch</text>
</g></g>
<g data-ab-part="node-6"><g>
<rect x="275" y="425" width="229" height="46" rx="8" class="k-system"/>
<text x="390" y="444" text-anchor="middle" class="m s13 b t-system">Milestone branch</text>
<text x="390" y="461" text-anchor="middle" class="s11 muted">one preview of every landed issue</text>
</g></g>
<g data-ab-part="node-7"><g><rect x="16" y="411" width="203" height="74" rx="10" class="k-muted panel"/>
<text x="118" y="436" text-anchor="middle" class="s12 b">Milestone description</text>
<text x="118" y="454" text-anchor="middle" class="s11">names the milestone branch</text>
<text x="118" y="472" text-anchor="middle" class="s11 muted">and its preview URL</text></g></g>
<g data-ab-part="node-8"><g>
<rect x="275" y="515" width="229" height="61" rx="8" class="k-neutral"/>
<text x="390" y="534" text-anchor="middle" class="m s13 b t-neutral">Milestone PR</text>
<text x="390" y="551" text-anchor="middle" class="s11 muted">from the milestone branch into</text>
<text x="390" y="566" text-anchor="middle" class="s11 muted">main</text>
</g></g>
