[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ub-agents"
version = "0.3.8"
description = "Small, project-owned engineering loops coordinated on GitHub"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0,<7", "textual==8.2.8"]

[project.scripts]
ub-agents = "ub_agents.cli:main"

[project.urls]
Repository = "https://github.com/uberblick-ai/ub-agents"
Issues = "https://github.com/uberblick-ai/ub-agents/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ub_agents = ["templates/*.yaml", "templates/*.md"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["C901", "PLR0912", "PLR0915", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
files = ["src/ub_agents"]
